<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Energy Distribution</title>
    <style>
        :root {
            --bg-color: transparent;
            --house-color: #ff4785;
            --consumer-color: #ff4785;
            --producer-color: #ffaa00;
            --line-color: rgba(255, 255, 255, 0.2);
            --text-color: #e0e0e0;
            --text-muted: #888899;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-sizing: border-box;
        }

        #dashboard-container {
            position: relative;
            width: 100%;
            height: 90%;
            min-height: 250px;
            max-width: 800px;
            max-height: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .node-bg { fill: #2a2a35; stroke-width: 3px; }
        .node-icon { fill: none; stroke: #fff; stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round; }
        .central-node .node-bg { fill: var(--house-color); stroke: none; }
        .central-node .node-icon { stroke: #fff; stroke-width: 2.5px; }
        .consumer-node .node-bg { stroke: var(--consumer-color); }
        .producer-node .node-bg { stroke: var(--producer-color); }
        .connection-line { fill: none; stroke: var(--line-color); stroke-width: 4px; }

        .energy-flow {
            fill: none; stroke-width: 4px; stroke-linecap: round; stroke-dasharray: 8 20;
            animation: flow linear infinite;
        }
        .consumer-flow { stroke: var(--consumer-color); }
        .producer-flow { stroke: var(--producer-color); animation-direction: reverse; }

        @keyframes flow {
            from { stroke-dashoffset: 28; }
            to { stroke-dashoffset: 0; }
        }

        .label-name { font-size: 14px; font-weight: 600; fill: var(--text-color); text-anchor: middle; paint-order: stroke; stroke: var(--bg-color); stroke-width: 3px; stroke-linecap: round; stroke-linejoin: round; }
        .label-value { font-size: 16px; font-weight: bold; fill: #fff; text-anchor: middle; paint-order: stroke; stroke: var(--bg-color); stroke-width: 3px; stroke-linecap: round; stroke-linejoin: round; }
        .label-cost { font-size: 12px; fill: var(--text-muted); text-anchor: middle; paint-order: stroke; stroke: var(--bg-color); stroke-width: 3px; stroke-linecap: round; stroke-linejoin: round; }
        .central-label-value { font-size: 18px; font-weight: bold; fill: #fff; text-anchor: middle; paint-order: stroke; stroke: var(--bg-color); stroke-width: 4px; stroke-linecap: round; stroke-linejoin: round; }
        
        .empty-message { text-align: center; color: var(--text-muted); padding: 20px; }
    </style>
</head>
<body>
    <div id="dashboard-container"></div>
    <script>
        let rawData = '__INITIAL_DATA__';
        let config = { house: { name: 'Haus', consumption: 0, cost: 0 }, consumers: [] };
        
        try {
            const decoded = rawData.replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
            config = JSON.parse(decoded);
        } catch (e) {
            console.error("Parse Error:", e);
        }

        window.addEventListener("message", function(event) {
            if (event.data) {
                try {
                    config = (typeof event.data === 'string') ? JSON.parse(event.data) : event.data;
                    updateUI();
                } catch(e) {
                    console.error("WS Parse Error:", e);
                }
            }
        });

        const SVG_NS = "http://www.w3.org/2000/svg";
        const VIEWBOX_SIZE = 600;
        const CENTER_X = VIEWBOX_SIZE / 2;
        const CENTER_Y = VIEWBOX_SIZE / 2;
        const RADIUS = 200;

        function renderDashboard() {
            const container = document.getElementById('dashboard-container');
            container.innerHTML = '';

            if (!config.consumers || config.consumers.length === 0) {
                container.innerHTML = '<div class="empty-message"><h2>Keine Verbraucher konfiguriert</h2><p>Bitte füge Verbraucher in den Instanz-Einstellungen hinzu.</p></div>';
                return;
            }

            const svg = document.createElementNS(SVG_NS, "svg");
            svg.setAttribute("viewBox", `0 0 ${VIEWBOX_SIZE} ${VIEWBOX_SIZE}`);
            svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

            const layerLines = document.createElementNS(SVG_NS, "g");
            const layerNodes = document.createElementNS(SVG_NS, "g");
            svg.appendChild(layerLines);
            svg.appendChild(layerNodes);

            const numNodes = config.consumers.length;
            let startAngle = -Math.PI / 2; 
            
            config.consumers.forEach((consumer, index) => {
                const angle = startAngle + (index * (2 * Math.PI / numNodes));
                const cx = CENTER_X + RADIUS * Math.cos(angle);
                const cy = CENTER_Y + RADIUS * Math.sin(angle);

                const lineBg = document.createElementNS(SVG_NS, "line");
                lineBg.setAttribute("x1", CENTER_X);
                lineBg.setAttribute("y1", CENTER_Y);
                lineBg.setAttribute("x2", cx);
                lineBg.setAttribute("y2", cy);
                lineBg.setAttribute("class", "connection-line");
                layerLines.appendChild(lineBg);

                if (consumer.consumption > 0) {
                    const lineFlow = document.createElementNS(SVG_NS, "line");
                    lineFlow.setAttribute("x1", CENTER_X);
                    lineFlow.setAttribute("y1", CENTER_Y);
                    lineFlow.setAttribute("x2", cx);
                    lineFlow.setAttribute("y2", cy);
                    
                    const isProducer = consumer.type === 1;
                    lineFlow.setAttribute("class", `energy-flow ${isProducer ? 'producer-flow' : 'consumer-flow'}`);
                    
                    const normalized = Math.min(consumer.consumption / 5.0, 1.0);
                    const duration = 3.0 - (normalized * 2.5);
                    lineFlow.style.animationDuration = `${duration}s`;
                    layerLines.appendChild(lineFlow);
                }

                const nodeGroup = document.createElementNS(SVG_NS, "g");
                const isProducer = consumer.type === 1;
                nodeGroup.setAttribute("class", isProducer ? "producer-node" : "consumer-node");
                
                const circle = document.createElementNS(SVG_NS, "circle");
                circle.setAttribute("cx", cx);
                circle.setAttribute("cy", cy);
                circle.setAttribute("r", 35);
                circle.setAttribute("class", "node-bg");
                nodeGroup.appendChild(circle);

                const icon = document.createElementNS(SVG_NS, "path");
                icon.setAttribute("d", "M-6,-12 L-10,2 L-2,2 L-6,14 L8,-2 L0,-2 Z");
                icon.setAttribute("transform", `translate(${cx}, ${cy}) scale(1.3)`);
                icon.setAttribute("class", "node-icon");
                nodeGroup.appendChild(icon);

                const isTopHalf = cy < CENTER_Y;
                const hasCost = consumer.cost !== undefined && consumer.cost !== null;
                // For top half, we need to shift the starting y position higher so all text lines clear the circle
                const labelYOffset = isTopHalf ? (hasCost ? -85 : -65) : 55;
                
                const textGroup = document.createElementNS(SVG_NS, "text");
                textGroup.setAttribute("x", cx);
                textGroup.setAttribute("y", cy + labelYOffset);
                
                const tspanName = document.createElementNS(SVG_NS, "tspan");
                tspanName.setAttribute("x", cx);
                tspanName.setAttribute("dy", 0);
                tspanName.setAttribute("class", "label-name");
                tspanName.textContent = consumer.name;
                textGroup.appendChild(tspanName);

                const tspanValue = document.createElementNS(SVG_NS, "tspan");
                tspanValue.setAttribute("x", cx);
                tspanValue.setAttribute("dy", 20);
                tspanValue.setAttribute("class", "label-value");
                tspanValue.textContent = Math.round((consumer.consumption || 0) * 1000) + " Wh";
                textGroup.appendChild(tspanValue);
                
                if (hasCost) {
                    const tspanCost = document.createElementNS(SVG_NS, "tspan");
                    tspanCost.setAttribute("x", cx);
                    tspanCost.setAttribute("dy", 18);
                    tspanCost.setAttribute("class", "label-cost");
                    tspanCost.textContent = `(${(consumer.cost || 0).toFixed(2)} €)`;
                    textGroup.appendChild(tspanCost);
                }

                nodeGroup.appendChild(textGroup);
                layerNodes.appendChild(nodeGroup);
            });

            const centerGroup = document.createElementNS(SVG_NS, "g");
            centerGroup.setAttribute("class", "central-node");
            
            const centerBg = document.createElementNS(SVG_NS, "circle");
            centerBg.setAttribute("cx", CENTER_X);
            centerBg.setAttribute("cy", CENTER_Y);
            centerBg.setAttribute("r", 45);
            centerBg.setAttribute("class", "node-bg");
            centerGroup.appendChild(centerBg);

            const houseIcon = document.createElementNS(SVG_NS, "path");
            houseIcon.setAttribute("d", "M0,-20 L22,0 L16,0 L16,16 L4,16 L4,6 L-4,6 L-4,16 L-16,16 L-16,0 L-22,0 Z");
            houseIcon.setAttribute("transform", `translate(${CENTER_X}, ${CENTER_Y}) scale(1.2)`);
            houseIcon.setAttribute("class", "node-icon");
            centerGroup.appendChild(houseIcon);

            const centerTextGroup = document.createElementNS(SVG_NS, "text");
            centerTextGroup.setAttribute("x", CENTER_X);
            centerTextGroup.setAttribute("y", CENTER_Y + 65);
            
            const cName = document.createElementNS(SVG_NS, "tspan");
            cName.setAttribute("x", CENTER_X);
            cName.setAttribute("dy", 0);
            cName.setAttribute("class", "label-name");
            cName.textContent = config.house.name || "Haus";
            centerTextGroup.appendChild(cName);
            
            const cVal = document.createElementNS(SVG_NS, "tspan");
            cVal.setAttribute("x", CENTER_X);
            cVal.setAttribute("dy", 22);
            cVal.setAttribute("class", "central-label-value");
            cVal.textContent = Math.round((config.house.consumption || 0) * 1000) + " Wh";
            centerTextGroup.appendChild(cVal);
            
            if (config.house.cost !== undefined && config.house.cost !== null) {
                const cCost = document.createElementNS(SVG_NS, "tspan");
                cCost.setAttribute("x", CENTER_X);
                cCost.setAttribute("dy", 18);
                cCost.setAttribute("class", "label-cost");
                cCost.textContent = `(${(config.house.cost || 0).toFixed(2)} €)`;
                centerTextGroup.appendChild(cCost);
            }

            centerGroup.appendChild(centerTextGroup);
            layerNodes.appendChild(centerGroup);

            container.appendChild(svg);
        }

        function updateUI() {
            renderDashboard();
        }

        updateUI();
    </script>
</body>
</html>
