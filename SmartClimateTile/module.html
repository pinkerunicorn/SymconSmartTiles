<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        :root {
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --text-main: var(--content-color, #ffffff);
            --transition-speed: 0.3s;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: var(--font-family);
            background: transparent;
            overflow: hidden;
            color: var(--text-main);
            user-select: none;
            -webkit-user-select: none;
        }

        .tile-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: clamp(10px, 3vh, 20px) clamp(10px, 4vw, 25px);
        }

        .gauge-row {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            flex-grow: 1;
        }

        .cc-gauge {
            position: relative;
            overflow: hidden;
            flex-grow: 1;
            max-width: 60%;
            aspect-ratio: 240 / 184;
            container-type: inline-size;
            margin: auto;
        }

        .cc-gauge-track {
            stroke: color-mix(in srgb, var(--content-color) 10%, transparent);
        }

        #gauge-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            aspect-ratio: 1;
            touch-action: none;
        }

        .temp-button {
            pointer-events: all;
            width: clamp(35px, 12cqw, 55px);
            height: clamp(35px, 12cqw, 55px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid color-mix(in srgb, var(--content-color) 20%, transparent);
            background: transparent;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
            flex-shrink: 0;
            font-size: clamp(24px, 10cqw, 32px);
            font-weight: 300;
        }
        
        .temp-button:active {
            background: color-mix(in srgb, var(--content-color) 10%, transparent);
            transform: scale(0.95);
        }
        .btn-minus { color: var(--color-cold, #3B82F6); border-color: color-mix(in srgb, var(--color-cold, #3B82F6) 50%, transparent); }
        .btn-plus { color: var(--color-warm, #EF4444); border-color: color-mix(in srgb, var(--color-warm, #EF4444) 50%, transparent); }

        .cc-gauge-info {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: clamp(10px, 12cqw, 40px);
            pointer-events: none;
        }

        .cc-gauge-status {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: clamp(6px, 2cqw, 12px);
            font-size: clamp(10px, 3cqw, 13px);
            font-weight: bold;
        }
        .cc-gauge-status svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        .cc-gauge-pills {
            display: flex;
            align-items: center;
            gap: clamp(4px, 2.5cqw, 10px);
            margin-bottom: clamp(2px, 1cqw, 6px);
        }

        .cc-gauge-pill {
            font-size: clamp(11px, 4cqw, 15px);
            color: color-mix(in srgb, var(--content-color) 80%, transparent);
            background: color-mix(in srgb, var(--content-color) 9%, transparent);
            padding: clamp(1px, 0.8cqw, 3px) clamp(6px, 2.2cqw, 10px);
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: clamp(3px, 1cqw, 6px);
        }

        .cc-gauge-pill svg {
            width: clamp(11px, 4cqw, 14px);
            height: clamp(11px, 4cqw, 14px);
            fill: color-mix(in srgb, var(--content-color) 60%, transparent);
        }

        .cc-gauge-temp-target {
            font-size: clamp(38px, 24cqw, 72px);
            line-height: 1;
            font-weight: 500;
        }

        .cc-gauge-temp-unit {
            font-size: clamp(16px, 10cqw, 24px);
            opacity: 0.5;
            vertical-align: super;
            margin-left: 1px;
            font-weight: normal;
        }

        .bottom-modes {
            display: flex;
            gap: clamp(16px, 6vw, 40px);
            justify-content: center;
            width: 100%;
        }

        .mode-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(4px, 1vh, 8px);
            cursor: pointer;
            padding: clamp(4px, 1vw, 8px);
            border-radius: clamp(6px, 2vw, 14px);
            background: transparent;
            border: none;
            color: color-mix(in srgb, var(--content-color) 40%, transparent);
            transition: all var(--transition-speed);
            touch-action: manipulation;
        }
        .mode-btn:hover { background: color-mix(in srgb, var(--content-color) 8%, transparent); }
        .mode-btn.active { color: var(--mode-color, var(--text-main)); }
        .mode-btn svg { width: clamp(24px, 7vw, 36px); height: clamp(24px, 7vw, 36px); fill: currentColor; }
        .mode-btn span { font-size: clamp(9px, 3vw, 12px); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="tile-wrapper">
        
        <div class="gauge-row">
            <div class="temp-button btn-minus" id="btnMinus">&minus;</div>
            
            <div class="cc-gauge" id="gauge-container">
                <svg id="gauge-svg" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
                            <stop id="gs0" offset="0%" stop-color="#3B82F6"/>
                            <stop id="gs100" offset="100%" stop-color="#EF4444"/>
                        </linearGradient>
                    </defs>
                    <path id="arc-bg" fill="none" stroke-width="6" stroke-linecap="round" class="cc-gauge-track" />
                    <path id="arc-fill" fill="none" stroke="url(#arcGrad)" stroke-width="6" stroke-linecap="round" />
                    
                    <g id="dot-group" style="display:none; cursor: pointer;">
                        <circle id="dot-glow" cx="0" cy="0" r="17" fill="#fff" opacity="0.12" />
                        <circle id="dot" cx="0" cy="0" r="10" fill="#fff" />
                    </g>
                    <path id="arc-hitzone" fill="none" stroke="transparent" stroke-width="40" stroke-linecap="round" style="cursor: pointer;" />
                </svg>
    
                <div class="cc-gauge-info">
                    <div class="cc-gauge-status" id="statusIndicators"></div>
                    
                    <div class="cc-gauge-pills">
                        <div class="cc-gauge-pill hidden" id="valveWrapper">
                            <svg viewBox="0 0 24 24"><path d="M22 13h-4V6c0-1.1-.9-2-2-2h-3V1h-2v3H8c-1.1 0-2 .9-2 2v7H2v2h4v7h12v-7h4v-2zm-6 0H8V6h8v7z"/></svg>
                            <span id="valveVal">--</span>
                        </div>
                        <div class="cc-gauge-pill" id="actualWrapper">
                            <svg viewBox="0 0 24 24"><path d="M15 13V5c0-1.66-1.34-3-3-3S9 3.34 9 5v8c-1.21.91-2 2.37-2 4 0 2.76 2.24 5 5 5s5-2.24 5-5c0-1.63-.79-3.09-2-4zm-4-8c0-.55.45-1 1-1s1 .45 1 1v4H11V5z"/></svg>
                            <span id="tempActual">--</span>°C
                        </div>
                        <div class="cc-gauge-pill hidden" id="humidityWrapper">
                            <svg viewBox="0 0 24 24"><path d="M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2c0-3.32-2.67-7.25-8-11.8zm0 18c-3.35 0-6-2.57-6-6.2 0-2.34 1.95-5.44 6-9.14 4.05 3.7 6 6.79 6 9.14 0 3.63-2.65 6.2-6 6.2z"/></svg>
                            <span id="humidityVal">--</span>
                        </div>
                    </div>
    
                    <div class="cc-gauge-temp-target" id="tempSollWrapper">
                        <span id="tempTarget">--</span><span class="cc-gauge-temp-unit">°C</span>
                    </div>
                </div>
            </div>
            
            <div class="temp-button btn-plus" id="btnPlus">&plus;</div>
        </div>

        <div class="bottom-modes" id="modesContainer"></div>
    </div>

    <script>
        const ICONS = {
            "Climate": "<path d=\"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3-11v2H9v-2h6z\"/>",
            "Window": "<path d=\"M11 20v-7H3v7h8zm2 0h8v-7h-8v7zm-2-9V4H3v7h8zm2 0h8V4h-8v7z\"/>",
            "Fire": "<path d=\"M17.5 13c0 2.8-2.5 4.8-5 5.5-.3-.9-1-1.5-1.5-2.2-.6-.9-1-2-1-3 0-1.6.8-3.1 2.2-4 0-.1-.2-.1-.2-.1-1.9 1-2.9 3.1-2.9 5.3 0 1.2.4 2.3 1.1 3.2-1.8-1-3-2.8-3-5 0-2.2 1.4-4 3-5 .7-.4 1.5-.7 2.3-1C13.8 5 15 3.5 15 2c0 0 0 0 0 0 2.2 2 3.8 4.7 3.8 7.8 0 1.6-.5 3-1.3 4.2z\"/>",
            "Moon": "<path d=\"M20.2 15.6c-2.3 2.5-6.2 3.1-9.2 1.2-3-1.9-4.3-5.5-3.2-8.8-3.5 1.7-5.5 5.9-4 9.6 1.5 3.6 5.6 5.6 9.3 4.4 2.8-1 4.9-3.4 5.6-6.3.3-.3.9 0 1.5-.1z\"/>",
            "default": "<path d=\"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z\"/>"
        };

        let rawData = '__INITIAL_DATA__';
        let state = {};

        try {
            const decoded = rawData
                .replace(/&quot;/g, '"')
                .replace(/&#039;/g, "'")
                .replace(/&amp;/g, '&')
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>');
            state = JSON.parse(decoded);
        } catch (e) {
            console.error('SCT: Parse Error', e);
        }

        if (!state.config) state.config = {};
        if (!state.config.tempMin) state.config.tempMin = 5.0;
        if (!state.config.tempMax || state.config.tempMax <= state.config.tempMin) state.config.tempMax = 30.0;
        if (!state.config.tempStep) state.config.tempStep = 0.5;
        if (state.config.colorCold === undefined) state.config.colorCold = 0x3B82F6;
        if (state.config.colorWarm === undefined) state.config.colorWarm = 0xEF4444;
        
        let isDragging = false;
        const els = {
            get svg()              { return document.getElementById('gauge-svg'); },
            get bgPath()          { return document.getElementById('arc-bg'); },
            get valPath()         { return document.getElementById('arc-fill'); },
            get hitZone()         { return document.getElementById('arc-hitzone'); },
            get dotGroup()        { return document.getElementById('dot-group'); },
            get dot()             { return document.getElementById('dot'); },
            get dotGlow()         { return document.getElementById('dot-glow'); },
            get tempActual()      { return document.getElementById('tempActual'); },
            get tempTarget()      { return document.getElementById('tempTarget'); },
            get tempSollWrapper() { return document.getElementById('tempSollWrapper'); },
            get humidityWrapper() { return document.getElementById('humidityWrapper'); },
            get humidityVal()     { return document.getElementById('humidityVal'); },
            get valveWrapper()    { return document.getElementById('valveWrapper'); },
            get valveVal()        { return document.getElementById('valveVal'); },
            get statusIndicators(){ return document.getElementById('statusIndicators'); },
            get modesContainer()  { return document.getElementById('modesContainer'); },
            get gradStart()       { return document.getElementById('gs0'); },
            get gradEnd()         { return document.getElementById('gs100'); },
            get arcGrad()         { return document.getElementById('arcGrad'); },
            get btnMinus()        { return document.getElementById('btnMinus'); },
            get btnPlus()         { return document.getElementById('btnPlus'); }
        };

        function intToHex(intColor) {
            let hex = Math.abs(intColor).toString(16);
            while (hex.length < 6) hex = "0" + hex;
            return "#" + hex;
        }
        
        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function lerpColor(c1, c2, t) {
            const rgb1 = hexToRgb(c1);
            const rgb2 = hexToRgb(c2);
            if(!rgb1 || !rgb2) return c1;
            const r = Math.round(rgb1.r + (rgb2.r - rgb1.r) * t);
            const g = Math.round(rgb1.g + (rgb2.g - rgb1.g) * t);
            const b = Math.round(rgb1.b + (rgb2.b - rgb1.b) * t);
            return `rgb(${r},${g},${b})`;
        }

        function animateValue(obj, start, end, duration, decimals = 1) {
            if (!obj) return;
            const endVal = isNaN(end) ? 0 : end;
            obj.innerHTML = endVal.toFixed(decimals);

            const startVal = isNaN(start) ? endVal : start;
            if (Math.abs(endVal - startVal) < 0.05 || !window.requestAnimationFrame) return;

            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeProgress = progress * (2 - progress);
                const current = startVal + (endVal - startVal) * easeProgress;
                obj.innerHTML = current.toFixed(decimals);
                if (progress < 1) window.requestAnimationFrame(step);
                else obj.innerHTML = endVal.toFixed(decimals);
            };
            window.requestAnimationFrame(step);
        }

        const ARC_START = 150;
        const ARC_SPAN = 240;
        const RADIUS = 100;
        const CENTER = 120;

        function polarToCartesian(angleInDegrees) {
            const angleInRadians = angleInDegrees * Math.PI / 180.0;
            return {
                x: CENTER + (RADIUS * Math.cos(angleInRadians)),
                y: CENTER + (RADIUS * Math.sin(angleInRadians))
            };
        }

        function describeArc(startAngle, span) {
            const start = polarToCartesian(startAngle);
            const end = polarToCartesian(startAngle + span);
            const largeArcFlag = span > 180 ? "1" : "0";
            return `M ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${RADIUS} ${RADIUS} 0 ${largeArcFlag} 1 ${end.x.toFixed(2)} ${end.y.toFixed(2)}`;
        }

        function tempToT(temp) {
            return Math.max(0, Math.min(1, (temp - state.config.tempMin) / (state.config.tempMax - state.config.tempMin)));
        }

        function angleToTemp(angle) {
            let norm = angle;
            while (norm < ARC_START - 20) norm += 360;
            const t = Math.max(0, Math.min(1, (norm - ARC_START) / ARC_SPAN));
            return state.config.tempMin + t * (state.config.tempMax - state.config.tempMin);
        }
        
        function getAngleFromEvent(e) {
            const rect = els.svg.getBoundingClientRect();
            const clientX = e.clientX ?? (e.touches?.[0]?.clientX ?? 0);
            const clientY = e.clientY ?? (e.touches?.[0]?.clientY ?? 0);
            const x = clientX - rect.left - (rect.width / 2);
            const y = clientY - rect.top - (rect.height / 2);
            let angle = Math.atan2(y, x) * 180 / Math.PI;
            if (angle < 0) angle += 360;
            return angle;
        }

        function renderGaugeStatic() {
            const cCold = intToHex(state.config.colorCold);
            const cWarm = intToHex(state.config.colorWarm);
            
            document.documentElement.style.setProperty('--color-cold', cCold);
            document.documentElement.style.setProperty('--color-warm', cWarm);
            
            els.bgPath.setAttribute('d', describeArc(ARC_START, ARC_SPAN));
            els.hitZone.setAttribute('d', describeArc(ARC_START, ARC_SPAN));
            
            const startPt = polarToCartesian(ARC_START);
            const endPt = polarToCartesian(ARC_START + ARC_SPAN);
            
            els.arcGrad.setAttribute('x1', startPt.x.toFixed(1));
            els.arcGrad.setAttribute('y1', startPt.y.toFixed(1));
            els.arcGrad.setAttribute('x2', endPt.x.toFixed(1));
            els.arcGrad.setAttribute('y2', endPt.y.toFixed(1));
            
            els.gradStart.setAttribute('stop-color', cCold);
            els.gradEnd.setAttribute('stop-color', cWarm);
        }

        function updateGaugeValue(temp, animate = true) {
            if (temp === null || isNaN(temp)) return;
            const t = tempToT(temp);
            const fillSpan = t * ARC_SPAN;
            
            if (fillSpan > 0.1) {
                els.valPath.setAttribute('d', describeArc(ARC_START, fillSpan));
                els.valPath.style.display = 'block';
            } else {
                els.valPath.style.display = 'none';
            }
            
            const dotAngle = ARC_START + fillSpan;
            const dotPt = polarToCartesian(dotAngle);
            const dotColor = lerpColor(intToHex(state.config.colorCold), intToHex(state.config.colorWarm), t);
            
            els.dotGroup.style.display = '';
            els.dotGroup.setAttribute('transform', `translate(${dotPt.x.toFixed(2)},${dotPt.y.toFixed(2)})`);
            els.dot.setAttribute('fill', dotColor);
            els.dotGlow.setAttribute('fill', dotColor);
            
            els.tempTarget.innerHTML = temp.toFixed(1);
        }

        function renderState(newState, oldState = {}) {
            if (newState.actualTemp !== oldState.actualTemp) {
                const oldT = oldState.actualTemp || newState.actualTemp;
                animateValue(els.tempActual, oldT, newState.actualTemp, 500, 1);
            }

            if (newState.targetTemp !== oldState.targetTemp && !isDragging) {
                updateGaugeValue(newState.targetTemp);
                if (newState.targetTemp === null) {
                    els.tempSollWrapper.classList.add('hidden');
                    els.dotGroup.style.display = 'none';
                } else {
                    els.tempSollWrapper.classList.remove('hidden');
                }
            }

            if (newState.hasHumidity) {
                els.humidityWrapper.classList.remove('hidden');
                els.humidityVal.textContent = newState.humidity + '%';
            } else {
                els.humidityWrapper.classList.add('hidden');
            }

            if (newState.hasValve) {
                els.valveWrapper.classList.remove('hidden');
                els.valveVal.textContent = newState.valvePosition + '%';
            } else {
                els.valveWrapper.classList.add('hidden');
            }

            if (JSON.stringify(newState.statusIndicators) !== JSON.stringify(oldState.statusIndicators)) {
                els.statusIndicators.innerHTML = '';
                (newState.statusIndicators || []).forEach(ind => {
                    if (ind.active) {
                        const div = document.createElement('div');
                        const iconPath = ICONS[ind.icon] || ICONS['default'];
                        div.innerHTML = `<svg viewBox="0 0 24 24">${iconPath}</svg>` + (ind.label ? ` <span>${ind.label}</span>` : '');
                        div.style.color = intToHex(ind.color);
                        els.statusIndicators.appendChild(div);
                    }
                });
            }

            if (JSON.stringify(newState.modes) !== JSON.stringify(oldState.modes) || newState.activeMode !== oldState.activeMode) {
                els.modesContainer.innerHTML = '';
                (newState.modes || []).forEach(mode => {
                    const btn = document.createElement('button');
                    const isActive = (String(mode.Value) === String(newState.activeMode));
                    btn.className = 'mode-btn' + (isActive ? ' active' : '');
                    
                    if (isActive) btn.style.setProperty('--mode-color', intToHex(mode.Color));
                    
                    const iconPath = ICONS[mode.Icon] || ICONS['default'];
                    btn.innerHTML = `<svg viewBox="0 0 24 24">${iconPath}</svg>` + 
                                   (newState.config.showLabels ? `<span>${mode.Caption}</span>` : '');
                    
                    btn.onclick = () => {
                        if (typeof requestAction === 'function') requestAction('SetMode', mode.Value);
                        const oldActive = state.activeMode;
                        state.activeMode = mode.Value;
                        renderState(state, {...state, activeMode: oldActive});
                    };
                    els.modesContainer.appendChild(btn);
                });
            }
        }

        function setTempFromEvent(e) {
            const angle = getAngleFromEvent(e);
            let val = angleToTemp(angle);
            val = Math.max(state.config.tempMin, Math.min(state.config.tempMax, val));
            val = Math.round(val / state.config.tempStep) * state.config.tempStep;
            updateGaugeValue(val, false);
            state.targetTemp = val;
        }

        function beginDrag(e) {
            isDragging = true;
            if (e.pointerId) els.svg.setPointerCapture(e.pointerId);
            setTempFromEvent(e);
        }

        els.hitZone.addEventListener('pointerdown', beginDrag);
        els.dotGroup.addEventListener('pointerdown', beginDrag);
        
        els.svg.addEventListener('pointermove', e => {
            if (isDragging) {
                e.preventDefault();
                setTempFromEvent(e);
            }
        });
        
        function endDrag() {
            if (isDragging) {
                isDragging = false;
                if (typeof requestAction === 'function') requestAction('SetTemperature', state.targetTemp);
            }
        }
        
        els.svg.addEventListener('pointerup', endDrag);
        els.svg.addEventListener('pointercancel', endDrag);

        function changeTemp(delta) {
            let newVal = Math.max(state.config.tempMin, Math.min(state.config.tempMax, (state.targetTemp || state.config.tempMin) + delta));
            newVal = Math.round(newVal / state.config.tempStep) * state.config.tempStep;
            state.targetTemp = newVal;
            updateGaugeValue(newVal);
            if (typeof requestAction === 'function') requestAction('SetTemperature', newVal);
        }

        if (els.btnMinus) els.btnMinus.addEventListener('click', () => changeTemp(-state.config.tempStep));
        if (els.btnPlus) els.btnPlus.addEventListener('click', () => changeTemp(state.config.tempStep));

        window.handleMessage = function(payload) {
            try {
                let data = typeof payload === 'string' ? JSON.parse(payload) : payload;
                const oldState = {...state};
                state = {...state, ...data};
                if (data.config) state.config = {...(oldState.config || {}), ...data.config};
                if (!state.config.tempMax || state.config.tempMax <= state.config.tempMin) state.config.tempMax = (state.config.tempMin || 5) + 25;
                if (!state.config.tempStep) state.config.tempStep = 0.5;
                
                renderGaugeStatic();
                renderState(state, oldState);
            } catch (e) {
                console.error('SCT: handleMessage error', e);
            }
        };

        renderGaugeStatic();
        renderState(state);
        updateGaugeValue(state.targetTemp || state.config.tempMin, false);
    </script>
</body>
</html>
