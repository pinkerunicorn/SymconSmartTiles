<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Irrigation Kachel</title>
    <style>
        :root {
            --bg-color: #1a1a1e;
            --glass-bg: rgba(30, 30, 35, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f0f0;
            --text-muted: #888890;
            --accent-pink: #ff4785;
            --accent-pink-glow: rgba(255, 71, 133, 0.5);
            --accent-blue: #00b4d8;
            --accent-blue-glow: rgba(0, 180, 216, 0.5);
            --success-green: #00e676;
            --success-green-glow: rgba(0, 230, 118, 0.4);
            --danger-red: #ff3366;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --radius-large: 16px;
            --radius-small: 8px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto 1fr;
            gap: 16px;
            height: 100%;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .dashboard-grid {
                grid-template-columns: 1fr 1fr;
            }
            .grid-right {
                grid-column: span 2;
            }
        }
        @media (max-width: 800px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .grid-right, .grid-top {
                grid-column: span 1;
            }
        }

        .panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-large);
            padding: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .panel:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 15px rgba(255, 71, 133, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .grid-top { grid-column: 1 / -1; }
        .grid-left { grid-column: 1; }
        .grid-center { grid-column: 2; }
        .grid-right { grid-column: 3; display: flex; flex-direction: column; gap: 16px; }

        .panel-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .panel-header svg {
            margin-right: 12px;
            width: 24px;
            height: 24px;
            fill: none;
            stroke: var(--accent-blue);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 4px var(--accent-blue-glow));
        }

        /* Meldung & Fortschritt */
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 12px;
        }
        .progress-title {
            font-size: 1.2rem;
            font-weight: 500;
        }
        .progress-percent {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-shadow: 0 0 10px var(--accent-blue-glow);
        }
        .progress-track {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), #00d4ff);
            border-radius: 6px;
            width: 0%;
            transition: width 1s ease-in-out;
            box-shadow: 0 0 15px var(--accent-blue-glow);
            position: relative;
        }
        /* Animated shine effect on progress bar */
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: translateX(-100%);
            animation: shimmer 2.5s infinite;
        }
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
        .progress-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* SmartLawnAI Data List */
        .data-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background 0.2s;
            border-radius: 6px;
            padding-left: 8px;
            padding-right: 8px;
        }
        .data-item:hover {
            background: rgba(255,255,255,0.03);
        }
        .data-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .data-label svg {
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
            transition: stroke 0.3s;
        }
        .data-item:hover .data-label svg {
            stroke: var(--accent-blue);
            filter: drop-shadow(0 0 3px var(--accent-blue-glow));
        }
        .data-value {
            font-weight: 500;
            font-size: 0.95rem;
        }
        .status-pill {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(255,255,255,0.1);
        }
        .status-pill.ok {
            background: var(--success-green);
            color: #000;
            box-shadow: 0 0 12px var(--success-green-glow);
        }
        .status-pill.error {
            background: var(--danger-red);
            color: #fff;
            box-shadow: 0 0 12px rgba(255,51,102,0.5);
        }

        /* Steuerung */
        .control-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .control-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }
        .control-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
        }
        .control-label svg {
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
        }
        
        /* Toggle Switch Neon */
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.1);
            transition: .4s;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .slider-toggle:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background-color: var(--text-muted);
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider-toggle {
            background-color: rgba(255, 71, 133, 0.2);
            border-color: var(--accent-pink);
            box-shadow: 0 0 10px var(--accent-pink-glow);
        }
        input:checked + .slider-toggle:before {
            transform: translateX(20px);
            background-color: var(--accent-pink);
            box-shadow: 0 0 8px var(--accent-pink);
        }

        /* Range Slider Neon */
        .control-slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-top: 8px;
        }
        .control-slider-container input[type=range] {
            flex-grow: 1;
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        .control-slider-container input[type=range]:focus {
            outline: none;
        }
        .control-slider-container input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }
        .control-slider-container input[type=range]::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--accent-pink);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            box-shadow: 0 0 10px var(--accent-pink-glow);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .control-slider-container input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 15px var(--accent-pink);
        }
        .slider-val {
            min-width: 45px;
            text-align: right;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Button Neon */
        .btn-neon {
            background: rgba(0, 180, 216, 0.15);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 0 0 5px var(--accent-blue-glow);
            box-shadow: 0 0 10px rgba(0, 180, 216, 0.2);
        }
        .btn-neon.active {
            background: var(--accent-blue);
            color: #000;
            box-shadow: 0 0 15px var(--accent-blue);
            text-shadow: none;
        }

        /* KI & Logs */
        .ki-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #d0d0d0;
            flex-grow: 1;
        }
        .log-container {
            flex-grow: 1;
            overflow-y: auto;
            max-height: 300px;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }
        /* Scrollbar */
        .log-container::-webkit-scrollbar { width: 6px; }
        .log-container::-webkit-scrollbar-track { background: transparent; }
        .log-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        .log-container::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        .log-entry {
            background: rgba(255,255,255,0.03);
            border-left: 3px solid var(--accent-blue);
            padding: 10px;
            border-radius: 0 6px 6px 0;
            transition: background 0.3s;
        }
        .log-entry:hover {
            background: rgba(255,255,255,0.06);
        }
        .log-entry.error { border-left-color: var(--danger-red); }
        .log-entry.success { border-left-color: var(--success-green); }
        .log-entry.warning { border-left-color: #ffb703; }
        
        .log-time { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
        .log-title { font-weight: 600; margin-bottom: 2px; }
        .log-desc { color: #b0b0b0; }

        .water-drop {
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

<div class="dashboard-grid">
    <!-- Top: Meldung / Fortschritt -->
    <div class="panel grid-top">
        <div class="panel-header">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Meldung
        </div>
        <div class="progress-header">
            <div class="progress-title" id="valMsgTitle">Keine aktive Bewässerung</div>
            <div class="progress-percent" id="valProgressPct">0%</div>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="valProgressBar" style="width: 0%"></div>
        </div>
        <div class="progress-footer">
            <div>Laufzeit: <span id="valRuntime">0 Min</span></div>
            <div>Verbleibend: <span id="valRemaining">0 Min</span></div>
        </div>
    </div>

    <!-- Left: SmartLawnAI -->
    <div class="panel grid-left">
        <div class="panel-header">
            <svg viewBox="0 0 24 24" class="water-drop"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
            SmartLawnAI
        </div>
        <div class="data-list" id="lawnDataList">
            <!-- Dynamically populated -->
        </div>
    </div>

    <!-- Center: Steuerung -->
    <div class="panel grid-center">
        <div class="panel-header">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            Steuerung
        </div>
        <div class="control-list">
            <div class="control-item">
                <div class="control-label"><svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg> Bewässerung läuft</div>
                <div class="btn-neon" id="btnIrrigation" onclick="sendAction('Action_CtrlIrrigationActive', !currentData.CtrlIrrigationActive)">Bewässern</div>
            </div>
            
            <div class="control-item">
                <div class="control-label"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> Automatik aktiv</div>
                <label class="toggle-switch">
                    <input type="checkbox" id="chkAuto" onchange="sendAction('Action_CtrlAutoActive', this.checked)">
                    <span class="slider-toggle"></span>
                </label>
            </div>
            
            <div class="control-item">
                <div class="control-label"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg> Sperrzeit aktiv</div>
                <label class="toggle-switch">
                    <input type="checkbox" id="chkBlock" onchange="sendAction('Action_CtrlBlockActive', this.checked)">
                    <span class="slider-toggle"></span>
                </label>
            </div>

            <div class="control-item">
                <div class="control-label"><svg viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg> Manuell Starten</div>
                <label class="toggle-switch">
                    <input type="checkbox" id="chkManual" onchange="sendAction('Action_CtrlManualStart', this.checked)">
                    <span class="slider-toggle"></span>
                </label>
            </div>

            <div style="margin-top: 10px;">
                <div class="control-label"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> Sickerpause</div>
                <div class="control-slider-container">
                    <input type="range" id="sldSoak" min="0" max="120" onchange="sendAction('Action_CtrlSoakPause', parseInt(this.value))">
                    <span class="slider-val" id="valSoak">0 Min</span>
                </div>
            </div>

            <div>
                <div class="control-label"><svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg> Trigger Feuchte</div>
                <div class="control-slider-container">
                    <input type="range" id="sldTrigger" min="0" max="100" onchange="sendAction('Action_CtrlTriggerMoisture', parseInt(this.value))">
                    <span class="slider-val" id="valTrigger">0 %</span>
                </div>
            </div>

            <div>
                <div class="control-label"><svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg> Ziel Feuchte</div>
                <div class="control-slider-container">
                    <input type="range" id="sldTarget" min="0" max="100" onchange="sendAction('Action_CtrlTargetMoisture', parseInt(this.value))">
                    <span class="slider-val" id="valTarget">0 %</span>
                </div>
            </div>

            <div>
                <div class="control-label"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> Max Dauer</div>
                <div class="control-slider-container">
                    <input type="range" id="sldMaxDur" min="0" max="120" onchange="sendAction('Action_CtrlMaxDuration', parseInt(this.value))">
                    <span class="slider-val" id="valMaxDur">0 Min</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Right: KI & Logs -->
    <div class="grid-right">
        <div class="panel" style="flex: 1;">
            <div class="panel-header">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="9" y2="15"></line><line x1="15" y1="9" x2="15" y2="15"></line></svg>
                KI Antwort
            </div>
            <div class="ki-text" id="valAiResponse">Lade KI Status...</div>
        </div>
        <div class="panel" style="flex: 2;">
            <div class="panel-header">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Loginfo
            </div>
            <div class="log-container" id="logFeed">
                <!-- Logs will be inserted here -->
            </div>
        </div>
    </div>
</div>

<script>
    let currentData = {};

    function handleMessage(data) {
        try {
            const payload = typeof data === 'string' ? JSON.parse(data) : data;
            currentData = payload;

            // Top Panel
            document.getElementById('valMsgTitle').textContent = payload.MessageTitle || 'Keine aktive Bewässerung';
            document.getElementById('valProgressPct').textContent = (payload.Progress || 0) + '%';
            document.getElementById('valProgressBar').style.width = (payload.Progress || 0) + '%';
            document.getElementById('valRuntime').textContent = payload.Runtime || '0 Min';
            document.getElementById('valRemaining').textContent = payload.Remaining || '0 Min';

            // Left Panel (SmartLawnAI)
            const listEl = document.getElementById('lawnDataList');
            listEl.innerHTML = '';
            
            const staticItems = [
                { label: 'Aktueller Durchfluss', val: payload.FlowRate, icon: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>' },
                { label: 'Regen Heute', val: payload.RainToday, icon: '<path d="M16 13v8M8 13v8M12 15v8M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path>' },
                { label: 'Regen Morgen', val: payload.RainTomorrow, icon: '<path d="M16 13v8M8 13v8M12 15v8M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path>' },
                { label: 'Heute', val: payload.ConsumptionToday, icon: '<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>' },
                { label: 'Diese Woche', val: payload.ConsumptionWeek, icon: '<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>' },
                { label: 'Dieser Monat', val: payload.ConsumptionMonth, icon: '<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>' }
            ];

            staticItems.forEach(item => {
                listEl.innerHTML += `
                    <div class="data-item">
                        <div class="data-label"><svg viewBox="0 0 24 24">${item.icon}</svg> ${item.label}</div>
                        <div class="data-value">${item.val}</div>
                    </div>
                `;
            });

            if (payload.MoistureSensors && payload.MoistureSensors.length > 0) {
                payload.MoistureSensors.forEach(s => {
                    listEl.innerHTML += `
                        <div class="data-item">
                            <div class="data-label"><svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg> ${s.Name}</div>
                            <div class="data-value">${s.Value}</div>
                        </div>
                    `;
                });
            }

            const statusClass = payload.DeviceStatusOk ? 'ok' : 'error';
            const statusText = payload.DeviceStatusOk ? 'Alles OK' : 'Fehler';
            listEl.innerHTML += `
                <div class="data-item">
                    <div class="data-label"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg> Gerätestatus</div>
                    <div class="status-pill ${statusClass}">${statusText}</div>
                </div>
            `;

            // Center Panel (Steuerung)
            const btnIrrigation = document.getElementById('btnIrrigation');
            if (payload.CtrlIrrigationActive) {
                btnIrrigation.classList.add('active');
                btnIrrigation.textContent = 'Bewässert';
            } else {
                btnIrrigation.classList.remove('active');
                btnIrrigation.textContent = 'Aus';
            }

            document.getElementById('chkAuto').checked = payload.CtrlAutoActive;
            document.getElementById('chkBlock').checked = payload.CtrlBlockActive;
            document.getElementById('chkManual').checked = payload.CtrlManualStart;

            document.getElementById('sldSoak').value = payload.CtrlSoakPause;
            document.getElementById('valSoak').textContent = payload.CtrlSoakPause + ' Min';

            document.getElementById('sldTrigger').value = payload.CtrlTriggerMoisture;
            document.getElementById('valTrigger').textContent = payload.CtrlTriggerMoisture + ' %';

            document.getElementById('sldTarget').value = payload.CtrlTargetMoisture;
            document.getElementById('valTarget').textContent = payload.CtrlTargetMoisture + ' %';

            document.getElementById('sldMaxDur').value = payload.CtrlMaxDuration;
            document.getElementById('valMaxDur').textContent = payload.CtrlMaxDuration + ' Min';

            // Right Panel (KI & Logs)
            document.getElementById('valAiResponse').innerHTML = (payload.AiResponse || 'Keine Antwort').replace(/\n/g, '<br>');
            
            // Format LogInfo (Assuming it might be a raw HTML string from Symcon's HTML Box)
            const logFeed = document.getElementById('logFeed');
            if (payload.LogInfo && payload.LogInfo.trim() !== '') {
                logFeed.innerHTML = payload.LogInfo; // Falls der User eine fertige HTMLBox übergibt
            } else {
                logFeed.innerHTML = '<div class="log-time" style="padding:10px;">Keine Logs verfügbar</div>';
            }

        } catch (e) {
            console.error("Error parsing data:", e);
        }
    }

    function sendAction(ident, value) {
        if (typeof requestAction !== 'undefined') {
            requestAction(ident, value);
        } else {
            console.log("Mock RequestAction:", ident, value);
        }
    }

    // Für Initialisierung
    if (typeof requestAction !== 'undefined') {
        requestAction('Init', 0);
    }
</script>
</body>
</html>
