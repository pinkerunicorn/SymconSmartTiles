<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
    --bg:#12121a;
    --panel:rgba(22,22,32,0.85);
    --text:#e8e8ec;
    --text-dim:#6e6e7a;
    --pink:#ff4785;
    --pink-g:rgba(255,71,133,0.45);
    --cyan:#00d4ff;
    --cyan-g:rgba(0,212,255,0.35);
    --green:#00e676;
    --green-g:rgba(0,230,118,0.35);
    --blue:#2979ff;
    --blue-g:rgba(41,121,255,0.45);
    --font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;font-size:14px}
body{padding:20px;display:flex;flex-direction:column;gap:30px;align-items:center}

/* ═══ HEADER (STATUS & AUTOMATIK) ═══ */
.header{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-height:50px}
.status-text{font-size:1.1rem;font-weight:600;color:var(--text);text-shadow:0 0 10px rgba(255,255,255,0.1)}
.badges{display:flex;gap:10px}
.badge{
    padding:4px 14px;border-radius:20px;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;
    background:rgba(255,255,255,0.05);color:var(--text-dim);border:1px solid rgba(255,255,255,0.1);
    transition:all .4s;
}
.badge.active-auto{
    background:rgba(0,230,118,0.15);color:var(--green);border-color:var(--green);
    box-shadow:0 0 14px var(--green-g);
}
.badge.active-water{
    background:rgba(0,212,255,0.15);color:var(--cyan);border-color:var(--cyan);
    box-shadow:0 0 14px var(--cyan-g);animation:pulseWater 2s infinite;
}
@keyframes pulseWater{0%,100%{box-shadow:0 0 14px var(--cyan-g)}50%{box-shadow:0 0 25px var(--cyan),0 0 40px var(--cyan-g)}}

/* ═══ GAUGE ROWS ═══ */
.dash-row{display:flex;justify-content:center;gap:3%;width:100%;flex-wrap:nowrap}
.gauge-box{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;max-width:300px}
.gauge-title{font-size:clamp(0.6rem, 10cqw, 0.85rem);color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;font-weight:600;white-space:nowrap;container-type:inline-size;width:100%;text-align:center}

/* ═══ FLOW GAUGE (SVG scales automatically via viewBox) ═══ */
.gauge-svg{width:100%;max-width:280px;height:auto;overflow:visible}
.g-bg{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:10;stroke-linecap:round}
.g-fill{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s ease-out,stroke .5s;filter:drop-shadow(0 0 6px var(--cyan-g))}
.g-fill.hot{filter:drop-shadow(0 0 12px var(--pink-g))}
.g-needle{fill:var(--text);transition:transform 1s ease-out;transform-origin:80px 80px;filter:drop-shadow(0 0 4px rgba(255,255,255,0.4))}
.g-center{fill:var(--panel);stroke:rgba(255,255,255,0.15);stroke-width:1}
.g-val{font-size:1.5rem;font-weight:700;fill:var(--cyan);text-anchor:middle;transition:fill .5s}
.g-val.hot{fill:var(--pink)}
.g-unit{font-size:.7rem;fill:var(--text-dim);text-anchor:middle}
.g-tick{fill:var(--text-dim);font-size:.55rem;text-anchor:middle}

/* ═══ WATER TANK ═══ */
.water-tank{
    width:100%;max-width:240px;aspect-ratio:1/1;border-radius:50%;
    border:3px solid rgba(255,255,255,0.08);
    box-shadow:0 0 20px rgba(0,212,255,0.15),inset 0 0 20px rgba(0,212,255,0.1);
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.4);
    container-type:inline-size;
}
.water-wave{
    position:absolute;top:100%;left:-50%;width:200%;height:200%;
    background:var(--cyan);opacity:0.8;border-radius:40%;
    animation:wave 4s linear infinite;
    transition:top 1.5s cubic-bezier(.4,0,.2,1);z-index:1;
}
.water-wave::before{
    content:'';position:absolute;top:-10px;left:0;width:100%;height:100%;
    background:var(--cyan);opacity:0.4;border-radius:42%;
    animation:wave 6s linear infinite;
}
@keyframes wave{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.water-text{position:relative;z-index:2;font-size:clamp(16px, 17cqw, 24px);font-weight:700;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.8)}
.water-label{position:relative;z-index:2;font-size:clamp(8px, 9cqw, 12px);color:rgba(255,255,255,0.9);text-transform:uppercase;text-shadow:0 1px 4px rgba(0,0,0,0.8);margin-top:2px}

/* ═══ MOISTURE GAUGE (RING) ═══ */
.m-container{position:relative;width:100%;max-width:240px;aspect-ratio:1/1;margin-top:5px;container-type:inline-size;}
.m-svg{width:100%;height:100%;overflow:visible;transform:rotate(-90deg)}
.m-bg{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:8}
.m-fill{fill:none;stroke:var(--green);stroke-width:8;stroke-dasharray:283;stroke-dashoffset:283;transition:stroke-dashoffset 1s ease-out,stroke .5s;filter:drop-shadow(0 0 8px var(--green-g))}
.m-fill.triggered{stroke:var(--blue);filter:drop-shadow(0 0 12px var(--blue-g))}
.m-trigger-line{stroke:rgba(255,255,255,0.8);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 2px #000)}
.m-text-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.m-val{font-size:clamp(18px, 24cqw, 30px);font-weight:700;color:var(--green);transition:color .5s;text-shadow:0 0 10px var(--green-g)}
.m-val.triggered{color:var(--blue);text-shadow:0 0 15px var(--blue-g)}
.m-unit{font-size:clamp(8px, 12cqw, 14px);color:var(--text-dim);font-weight:600;text-transform:uppercase;margin-top:-2px}

</style>
</head>
<body>

<div class="header">
    <div class="status-text" id="summaryStatus">Warte auf Daten...</div>
    <div class="badges">
        <div id="badgeAuto" class="badge">Automatik Inaktiv</div>
        <div id="badgeWater" class="badge" style="display:none">Bewässerung</div>
    </div>
</div>

<div class="dash-row">
    <!-- Flow Gauge -->
    <div class="gauge-box">
        <div class="gauge-title">Durchfluss</div>
        <svg class="gauge-svg" viewBox="0 0 160 95">
            <text class="g-tick" id="gt0" x="35" y="80">0</text>
            <text class="g-tick" id="gt1" x="48" y="52">3</text>
            <text class="g-tick" id="gt2" x="80" y="38">6</text>
            <text class="g-tick" id="gt3" x="112" y="52">9</text>
            <text class="g-tick" id="gt4" x="125" y="80">12</text>
            <path class="g-bg" d="M 20 80 A 60 60 0 0 1 140 80"/>
            <path id="flowArc" class="g-fill" d="M 20 80 A 60 60 0 0 1 140 80" stroke-dasharray="188.5" stroke-dashoffset="188.5" stroke="var(--cyan)"/>
            <polygon id="flowNeedle" class="g-needle" points="80,30 77,78 83,78"/>
            <circle class="g-center" cx="80" cy="80" r="6"/>
            <text id="flowVal" class="g-val" x="80" y="75">0,0</text>
            <text class="g-unit" x="80" y="92">l/min</text>
        </svg>
    </div>

    <!-- Water Tank -->
    <div class="gauge-box">
        <div class="gauge-title">Verbrauch</div>
        <div class="water-tank">
            <div class="water-wave" id="tankWave"></div>
            <div class="water-text" id="tankVal">0 L</div>
            <div class="water-label" id="tankLbl">Bereit</div>
        </div>
    </div>
</div>

<div class="dash-row" id="moistureRow" style="margin-top:20px">
    <!-- Moisture gauges rendered here -->
</div>

<script>
let currentGaugeMax = 12;

function handleMessage(raw){
    try{
        const d = typeof raw==='string' ? JSON.parse(raw) : raw;
        if(d.error) { document.getElementById('summaryStatus').textContent = d.error; return; }

        // --- Status & Badges ---
        // Strip HTML from SummaryStatus (progress bars) and just show the text
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = d.SummaryStatus || 'Bereit';
        document.getElementById('summaryStatus').textContent = tempDiv.textContent.replace(/Verbleibend.*/, '');

        const bAuto = document.getElementById('badgeAuto');
        if(d.AutomaticActive) {
            bAuto.className = 'badge active-auto';
            bAuto.textContent = 'Automatik Aktiv';
        } else {
            bAuto.className = 'badge';
            bAuto.textContent = 'Automatik Inaktiv';
        }

        const bWater = document.getElementById('badgeWater');
        if(d.WateringActive) {
            bWater.style.display = 'block';
            bWater.className = 'badge active-water';
        } else {
            bWater.style.display = 'none';
        }

        // --- Flow Gauge ---
        let flowRate = d.FlowRateRaw || 0;
        if (flowRate > currentGaugeMax * 0.95) {
            currentGaugeMax = Math.max(12, Math.ceil((flowRate * 1.1) / 4) * 4);
            document.getElementById('gt1').textContent = currentGaugeMax * 0.25;
            document.getElementById('gt2').textContent = currentGaugeMax * 0.5;
            document.getElementById('gt3').textContent = currentGaugeMax * 0.75;
            document.getElementById('gt4').textContent = currentGaugeMax;
        }
        const fArcLen = 188.5; 
        const fPct = Math.min(1, Math.max(0, flowRate / currentGaugeMax));
        const fOffset = fArcLen * (1 - fPct);
        const fArc = document.getElementById('flowArc');
        fArc.setAttribute('stroke-dashoffset', fOffset);
        
        const isHot = flowRate >= (currentGaugeMax * 0.75);
        if(isHot){
            fArc.setAttribute('stroke', 'var(--pink)');
            fArc.classList.add('hot');
            document.getElementById('flowVal').classList.add('hot');
        } else {
            fArc.setAttribute('stroke', 'var(--cyan)');
            fArc.classList.remove('hot');
            document.getElementById('flowVal').classList.remove('hot');
        }
        
        const angle = -90 + fPct * 180;
        document.getElementById('flowNeedle').style.transform = `rotate(${angle}deg)`;
        document.getElementById('flowVal').textContent = flowRate.toFixed(1).replace('.',',');

        // --- Water Tank ---
        const tankW = document.getElementById('tankWave');
        const tankV = document.getElementById('tankVal');
        const tankL = document.getElementById('tankLbl');
        let prog = 0, remMin = 0;
        if(d.SummaryStatus){
            const pM = d.SummaryStatus.match(/(\d+)%/);
            if(pM) prog = parseInt(pM[1]);
            const mM = d.SummaryStatus.match(/Verbleibend:.*?(\d+):/);
            if(mM) remMin = parseInt(mM[1]);
        }
        
        if(d.WateringActive && prog > 0 && remMin > 0 && flowRate > 0) {
            const elapMin = remMin / (1 - (prog/100)) * (prog/100);
            const totMin = remMin + elapMin;
            const cVol = Math.round(elapMin * flowRate);
            const tVol = Math.round(totMin * flowRate);
            tankW.style.top = (100 - prog) + '%';
            tankV.textContent = cVol + ' L';
            tankL.textContent = 'von ' + tVol + ' L';
        } else if (d.WateringActive && flowRate > 0) {
            tankW.style.top = '50%';
            tankV.textContent = '~ L';
            tankL.textContent = 'Läuft...';
        } else {
            tankW.style.top = '100%';
            tankV.textContent = '0 L';
            tankL.textContent = 'Bereit';
        }

        // --- Moisture Gauges ---
        const mRow = document.getElementById('moistureRow');
        if(d.MoistureSensors && d.MoistureSensors.length) {
            const trigger = d.TriggerFeuchte || 0;
            let mHtml = '';
            
            d.MoistureSensors.forEach(s => {
                const val = Math.max(0, Math.min(100, s.Raw));
                const isTriggered = val <= trigger;
                
                // Ring calculation (circumference of r=45 is ~282.7)
                const c = 282.74;
                const offset = c - (val / 100) * c;
                
                // Trigger line calculation
                // Transform from percentage (0-100) to degrees on the circle
                // The circle starts at top (-90deg in CSS, which is 0deg for stroke-dasharray)
                // So 0% is at top. 25% is at right (90deg).
                const triggerDeg = (trigger / 100) * 360;
                // Calculate x, y on circle r=45, center 55,55
                // SVG coordinates: 0deg is right (+x). But we rotated the SVG -90deg.
                // So in the unrotated SVG space, 0% is right. We need to map trigger to radians.
                const rad = (triggerDeg * Math.PI) / 180;
                const tx1 = 55 + 38 * Math.cos(rad);
                const ty1 = 55 + 38 * Math.sin(rad);
                const tx2 = 55 + 52 * Math.cos(rad);
                const ty2 = 55 + 52 * Math.sin(rad);
                
                mHtml += `
                <div class="gauge-box">
                    <div class="gauge-title">${s.Name}</div>
                    <div class="m-container">
                        <svg class="m-svg" viewBox="0 0 110 110">
                            <circle class="m-bg" cx="55" cy="55" r="45"/>
                            <circle class="m-fill ${isTriggered ? 'triggered' : ''}" cx="55" cy="55" r="45" style="stroke-dashoffset:${offset}"/>
                            ${trigger > 0 ? `<line class="m-trigger-line" x1="${tx1}" y1="${ty1}" x2="${tx2}" y2="${ty2}" />` : ''}
                        </svg>
                        <div class="m-text-wrap">
                            <div class="m-val ${isTriggered ? 'triggered' : ''}">${Math.round(val)}</div>
                            <div class="m-unit">%</div>
                        </div>
                    </div>
                </div>`;
            });
            mRow.innerHTML = mHtml;
        } else {
            mRow.innerHTML = '';
        }

    }catch(e){console.error('Parse error:',e)}
}

if(typeof requestAction!=='undefined')requestAction('Init',0);
</script>
</body>
</html>
